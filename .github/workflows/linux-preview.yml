name: ACID RECALL Linux preview

on:
  push:
    branches: [linux-preview]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acid-recall-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appimage:
    runs-on: ubuntu-22.04
    env:
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libxkbcommon-x11-0 patchelf
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Set build metadata
        run: scripts/release-env.sh >> "$GITHUB_ENV"
      - name: Test MIDI control and clock
        run: cargo test --locked -p orb-ui --lib midi::
      - name: Build Linux binaries
        run: scripts/build.sh "$TARGET"
      - name: Package and test the AppImage
        run: |
          SKIP_BUILD=1 scripts/package-appimage.sh "$TARGET"
          image="dist/$TARGET/OpenRB-338-$(scripts/version.sh)-x86_64.AppImage"
          scripts/appimage-smoke.sh "$image"
          mv "$image" "dist/$TARGET/ACID-RECALL-Linux-preview-$(scripts/version.sh)-x86_64.AppImage"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ACID-RECALL-Linux-preview-x86_64
          path: dist/x86_64-unknown-linux-gnu/ACID-RECALL-Linux-preview-*-x86_64.AppImage
          if-no-files-found: error
