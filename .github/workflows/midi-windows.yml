name: ACID RECALL Windows

on:
  push:
    branches: [main, codex/windows-dx12-1.1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: midi-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Prepare ASIO SDK and LLVM
        shell: pwsh
        run: . ./scripts/setup-asio.ps1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          cache-on-failure: true
      - name: Install formatting toolchain
        run: rustup toolchain install nightly-2026-10-18 --profile minimal --component rustfmt
      - name: Format check (print any required patch)
        shell: pwsh
        run: |
          cargo +nightly-2026-10-18 fmt --all
          git diff --exit-code
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked -p orb-ui --lib --bins --test cli_args --test sidechain --test theme --test arpeggiator --test generator --test midi_preset --test midi --test midi_caps --test midi_clock --test settings --test wired --test repaint --test menu
      - name: Engine and sidechain regression tests
        run: cargo test --locked -p orb-engine
      - name: Check default skin and render preview
        shell: pwsh
        run: |
          cargo test --locked -p orb-ui-art
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --locked -p orb-ui-art -- graphite graphite-preview
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output ('GRAPHITE_PREVIEW:' + [Convert]::ToBase64String([IO.File]::ReadAllBytes((Join-Path $PWD 'graphite-preview/panel.png'))))
      - name: Audio callback allocation and MIDI Clock guards
        run: cargo test --locked -p orb-player --lib --test no_alloc --test midi_clock
      - name: Studio release performance
        run: |
          cargo test --release --locked -p orb-engine studio::tests::release_ -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release --locked -p orb-engine release_time_warp_32_voice_performance -- --nocapture
      - name: Portable Windows build
        run: cargo build --release --locked -p orb-ui
      - name: Verify default DX12 startup
        shell: pwsh
        run: |
          Remove-Item Env:WGPU_BACKEND -ErrorAction SilentlyContinue
          $env:ORB_GPU_INFO = '1'
          $graphicsShot = Join-Path $PWD 'dx12-startup.png'
          $graphicsError = Join-Path $PWD 'dx12-startup.log'
          $graphicsProcess = Start-Process -FilePath target/release/OpenRB-338.exe -WindowStyle Hidden -PassThru -RedirectStandardError $graphicsError -ArgumentList @('--demo', '--size', '1600x1000', '--screenshot', $graphicsShot)
          if (-not $graphicsProcess.WaitForExit(45000)) { Stop-Process -Id $graphicsProcess.Id; throw 'DX12 startup timed out' }
          $graphicsLog = Get-Content -Raw -LiteralPath $graphicsError
          Write-Output $graphicsLog
          if ($graphicsProcess.ExitCode -ne 0 -or !(Test-Path -LiteralPath $graphicsShot) -or $graphicsLog -notmatch 'gpu: Dx12') { throw 'Default startup did not render using DX12' }
          Remove-Item Env:ORB_GPU_INFO
      - name: Capture the desktop interface
        shell: pwsh
        run: |
          $previewPath = Join-Path $PWD 'graphite-preview/desktop.png'
          $process = Start-Process -FilePath target/release/OpenRB-338.exe -WindowStyle Hidden -PassThru -ArgumentList @('--demo', '--size', '1600x1000', '--ppp', '0.6', '--screenshot', $previewPath)
          if (-not $process.WaitForExit(45000)) { Stop-Process -Id $process.Id }
          if (Test-Path -LiteralPath $previewPath) {
            Write-Output ('GRAPHITE_APP_PREVIEW:' + [Convert]::ToBase64String([IO.File]::ReadAllBytes($previewPath)))
          } else {
            Write-Output 'Desktop screenshot unavailable on this runner; vector preview is included.'
          }
          foreach ($studioView in @('sampler', 'space', 'trial')) {
            $studioPreviewPath = Join-Path $PWD ('graphite-preview/' + $studioView + '.png')
            $studioProcess = Start-Process -FilePath target/release/OpenRB-338.exe -WindowStyle Hidden -PassThru -ArgumentList @('--demo', '--size', '1600x1000', '--ppp', '0.6', '--studio-view', $studioView, '--screenshot', $studioPreviewPath)
            if (-not $studioProcess.WaitForExit(45000)) { Stop-Process -Id $studioProcess.Id }
            if (Test-Path -LiteralPath $studioPreviewPath) {
              Write-Output ('STUDIO_' + $studioView.ToUpper() + '_PREVIEW:' + [Convert]::ToBase64String([IO.File]::ReadAllBytes($studioPreviewPath)))
            }
          }
      - name: Prepare portable release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path midi-preview
          Copy-Item target/release/OpenRB-338.exe midi-preview/ACID-RECALL.exe
          $acidVersion = (cargo metadata --no-deps --locked --format-version 1 | ConvertFrom-Json).packages | Where-Object name -eq 'orb-ui' | Select-Object -ExpandProperty version
          Set-Content -LiteralPath midi-preview/VERSION -Value $acidVersion -Encoding ascii
          Copy-Item CHANGELOG.md midi-preview/
          Copy-Item ('docs/releases/' + $acidVersion + '.md') midi-preview/RELEASE-NOTES.md
          New-Item -ItemType Directory -Force -Path midi-preview/docs/releases,midi-preview/releases
          Copy-Item docs/releases/*.md midi-preview/docs/releases/
          Copy-Item docs/releases/*.md midi-preview/releases/
          New-Item -ItemType Directory -Force -Path midi-preview/docs,midi-preview/assets/brand
          Copy-Item docs/acid-recall.md,docs/studio.md,docs/midi-controller.md,docs/midi-clock.md,docs/sampler-drums.md midi-preview/docs/
          Copy-Item docs/studio.md,docs/midi-controller.md,docs/midi-clock.md,docs/sampler-drums.md midi-preview/
          Copy-Item docs/graphics-startup.md midi-preview/docs/
          Copy-Item docs/graphics-startup.md midi-preview/README-GRAPHICS.md
          Copy-Item assets/brand/acid-recall.png,assets/brand/acid-recall.ico midi-preview/assets/brand/
          Copy-Item LICENSE midi-preview/
          Copy-Item docs/midi-controller.md midi-preview/README-MIDI.md
          Copy-Item docs/midi-clock.md midi-preview/README-MIDI-CLOCK.md
          Copy-Item docs/pattern-generator.md midi-preview/README-RANDOM.md
          Copy-Item docs/arpeggiator.md midi-preview/README-ARP.md
          Copy-Item graphite-preview/panel.png midi-preview/Graphite-preview.png
          Copy-Item docs/graphite.md midi-preview/README-GRAPHITE.md
          Copy-Item docs/sidechain.md midi-preview/README-SIDECHAIN.md
          Copy-Item docs/studio.md midi-preview/README-STUDIO.md
          Copy-Item docs/sampler-drums.md midi-preview/README-SAMPLER-DRUMS.md
          Copy-Item docs/LICENSE-SYMPHONIA.txt midi-preview/LICENSE-SYMPHONIA.txt
          Copy-Item .build-tools/asio/sdk/ASIOSDK/LICENSE.txt midi-preview/LICENSE-ASIO-SDK.txt
          New-Item -ItemType Directory -Force -Path midi-preview/sources
          Copy-Item .build-tools/asio/ASIO-SDK_2.3.4_2025-10-15.zip midi-preview/sources/
          foreach ($studioView in @('sampler', 'space', 'trial')) {
            $studioPreviewPath = 'graphite-preview/' + $studioView + '.png'
            if (Test-Path -LiteralPath $studioPreviewPath) { Copy-Item -LiteralPath $studioPreviewPath -Destination midi-preview/ }
          }
          if (Test-Path graphite-preview/desktop.png) { Copy-Item graphite-preview/desktop.png midi-preview/Graphite-desktop.png }
      - uses: actions/upload-artifact@v4
        with:
          name: ACID-RECALL-Windows-x64
          path: midi-preview/
          if-no-files-found: error
          retention-days: 30

  publish-preview:
    name: Publish public Windows download
    needs: windows
    # The consolidation merge keeps the exact ZIP already approved by the user.
    # Later main commits publish normally after the Windows checks succeed.
    if: github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[keep-approved-download]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: acid-recall-public-windows-preview
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ACID-RECALL-Windows-x64
          path: midi-preview
      - name: Publish portable ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
        shell: bash
        run: bash scripts/publish-acid-release.sh

  publish-laptop-test:
    name: Publish separate laptop compatibility test
    needs: windows
    if: github.ref == 'refs/heads/codex/windows-dx12-1.1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ACID-RECALL-Windows-x64
          path: midi-preview
      - name: Publish V1.1 laptop test without replacing the stable download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag=acid-recall-v1.1.0-laptop-test
          asset=ACID-RECALL-1.1.0-LAPTOP-TEST-Windows-x64.zip
          (cd midi-preview && zip -r "../${asset}" .)
          cp midi-preview/RELEASE-NOTES.md laptop-notes.md
          printf '\nBuild source: https://github.com/%s/commit/%s\n' "$GH_REPO" "$BUILD_SHA" >> laptop-notes.md
          if gh release view "$tag" > /dev/null 2>&1; then
            test "$(gh api "repos/${GH_REPO}/commits/${tag}" --jq .sha)" = "$BUILD_SHA"
            gh release upload "$tag" "$asset" --clobber
          else
            if pinned_sha=$(gh api "repos/${GH_REPO}/commits/${tag}" --jq .sha 2>/dev/null); then test "$pinned_sha" = "$BUILD_SHA"; fi
            gh release create "$tag" "$asset" --target "$BUILD_SHA" --title 'ACID RECALL 1.1 — Laptop compatibility test' --prerelease --latest=false --notes-file laptop-notes.md
          fi
