name: AcidSynth V2 Windows preview

on:
  push:
    branches: [feature/v2-acidsynth]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acidsynth-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Prepare ASIO and LLVM
        shell: pwsh
        run: . ./scripts/setup-asio.ps1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          cache-on-failure: true
      - name: Build the desktop preview
        run: cargo build --locked --release -p orb-ui
      - name: Assemble portable preview
        shell: pwsh
        run: |
          $out = New-Item -ItemType Directory -Path acidsynth-preview
          Copy-Item target/release/OpenRB-338.exe "$out/ACID-RECALL-V2-Preview.exe"
          if (Test-Path assets/demos/Low-Orbit.recall) { Copy-Item assets/demos/Low-Orbit.recall "$out/Low-Orbit.recall" }
          Copy-Item LICENSE "$out/LICENSE"
          Copy-Item docs/LICENSE-SYMPHONIA.txt "$out/LICENSE-SYMPHONIA.txt"
          Copy-Item .build-tools/asio/sdk/ASIOSDK/LICENSE.txt "$out/LICENSE-ASIO-SDK.txt"
          New-Item -ItemType Directory -Path "$out/sources"
          Copy-Item .build-tools/asio/ASIO-SDK_2.3.4_2025-10-15.zip "$out/sources/"
          "V2 AcidSynth preview - ${{ github.sha }}" | Set-Content "$out/VERSION"
      - name: Render five factory patches with the native sound engine
        run: cargo run --locked --release -p orb-engine --example soundcheck -- acidsynth-preview/AcidSynth-Soundcheck.wav
      - name: Capture the demo rack and the AcidSynth editors
        if: hashFiles('assets/demos/Low-Orbit.recall') != ''
        shell: pwsh
        continue-on-error: true
        run: |
          foreach ($view in @('Low-Orbit','synth','chord')) {
            $shot = "acidsynth-preview/$view.png"
            $flags = @('--size','1600x1000','--ppp','1','--screenshot',$shot)
            if ($view -eq 'Low-Orbit') {
              $flags += 'assets/demos/Low-Orbit.recall'
            } else {
              $flags += @('--demo','--studio-view',$view)
            }
            $process = Start-Process -FilePath target/release/OpenRB-338.exe -WindowStyle Hidden -PassThru -ArgumentList $flags
            if (-not $process.WaitForExit(45000)) { Stop-Process -Id $process.Id }
            if (-not (Test-Path $shot)) { throw "Runner could not capture $view" }
            if ($view -in @('synth','chord')) {
              Add-Type -AssemblyName System.Drawing
              $full = [Drawing.Image]::FromFile((Resolve-Path $shot).Path)
              $thumb = [Drawing.Bitmap]::new($full, 840, [int](840 * $full.Height / $full.Width))
              $memory = [IO.MemoryStream]::new()
              $thumb.Save($memory, [Drawing.Imaging.ImageFormat]::Jpeg)
              Write-Output ("EDITOR_" + $view + "=" + [Convert]::ToBase64String($memory.ToArray()))
              $memory.Dispose()
              $thumb.Dispose()
              $full.Dispose()
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ACID-RECALL-V2-AcidSynth-Windows-x64
          path: acidsynth-preview/
          if-no-files-found: error
      - name: Run engine, player and interface tests
        run: cargo test --locked -p orb-engine -p orb-player -p orb-ui --no-fail-fast
